<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebCodecs vs ffmpeg ベンチ</title>
    <style>
      body { font-family: sans-serif; margin: 16px; max-width: 900px; }
      fieldset { margin-bottom: 12px; }
      label { display: inline-block; margin: 4px 12px 4px 0; }
      input[type="number"] { width: 7em; }
      table { border-collapse: collapse; width: 100%; margin-top: 12px; }
      th, td { border: 1px solid #999; padding: 6px 8px; text-align: left; font-size: 13px; }
      #log { white-space: pre-wrap; background: #f4f4f4; padding: 8px; min-height: 120px; font-size: 12px; }
      button { margin-right: 8px; padding: 6px 12px; }
    </style>
  </head>
  <body>
    <h1>WebCodecs vs ffmpeg ベンチ</h1>
    <p>
      拡張と同じファイル（<code>../webcodecs-export.js</code> と
      <code>../vendor/</code> 配下）を読み込む。サーバ起動:
      <code>node bench/serve.mjs</code> → このページを
      <code>http://localhost:8765/bench/</code> で開く。
    </p>

    <fieldset>
      <legend>入力</legend>
      <div><label>ファイル <input id="file" type="file" accept="video/*" /></label></div>
      <div>
        <label>URL から読み込み <input id="fileUrl" type="text" size="48" value="samples/bbb_10s_even.mp4" /></label>
        <button id="loadUrl" type="button">読み込む</button>
        <span id="loadedName"></span>
      </div>
      <div>
        <label>開始秒 <input id="start" type="number" step="0.1" value="0" /></label>
        <label>終了秒 <input id="end" type="number" step="0.1" value="5" /></label>
        <label>速度 <input id="speed" type="number" step="0.05" min="0.25" max="4" value="1" /></label>
      </div>
      <div>
        <label>回転
          <select id="rotation">
            <option value="0">0</option>
            <option value="90">90</option>
            <option value="180">180</option>
            <option value="270">270</option>
          </select>
        </label>
        <label><input id="flipH" type="checkbox" /> 左右反転</label>
        <label><input id="flipV" type="checkbox" /> 上下反転</label>
      </div>
      <div>
        <label>crop x <input id="cropX" type="number" step="1" value="" placeholder="全面" /></label>
        <label>y <input id="cropY" type="number" step="1" value="" placeholder="全面" /></label>
        <label>w <input id="cropW" type="number" step="1" value="" placeholder="全面" /></label>
        <label>h <input id="cropH" type="number" step="1" value="" placeholder="全面" /></label>
      </div>
      <div>
        <button id="runWebcodecs" type="button">WebCodecs で書き出し</button>
        <button id="runFfmpeg" type="button">ffmpeg で書き出し</button>
      </div>
    </fieldset>

    <table id="results">
      <thead>
        <tr>
          <th>経路</th>
          <th>所要時間 (ms)</th>
          <th>出力 (bytes)</th>
          <th>出力解像度</th>
          <th>エンコーダ設定</th>
          <th>ログ</th>
          <th>出力</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>ログ</h2>
    <div id="log"></div>

    <script src="../vendor/ffmpeg/ffmpeg.js"></script>
    <script src="../vendor/mediabunny/mediabunny.iife.js"></script>
    <script src="../webcodecs-export.js"></script>
    <script src="./bench.js"></script>
  </body>
</html>
