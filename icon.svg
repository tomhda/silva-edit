<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="シルバエディット">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f1e7" />
      <stop offset="100%" stop-color="#e8dcc8" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)" />

  <!-- Film strip holes (top) -->
  <rect x="20" y="14" width="8" height="6" rx="1" fill="#2a2520" opacity="0.3" />
  <rect x="36" y="14" width="8" height="6" rx="1" fill="#2a2520" opacity="0.3" />
  <rect x="84" y="14" width="8" height="6" rx="1" fill="#2a2520" opacity="0.3" />
  <rect x="100" y="14" width="8" height="6" rx="1" fill="#2a2520" opacity="0.3" />

  <!-- Film strip holes (bottom) -->
  <rect x="20" y="108" width="8" height="6" rx="1" fill="#2a2520" opacity="0.3" />
  <rect x="36" y="108" width="8" height="6" rx="1" fill="#2a2520" opacity="0.3" />
  <rect x="84" y="108" width="8" height="6" rx="1" fill="#2a2520" opacity="0.3" />
  <rect x="100" y="108" width="8" height="6" rx="1" fill="#2a2520" opacity="0.3" />

  <!-- Silba-kun (Black English Cocker Spaniel) -->
  <!-- Left ear -->
  <ellipse cx="35" cy="52" rx="12" ry="22" fill="#1a1714" />
  <ellipse cx="35" cy="54" rx="8" ry="16.5" fill="#2a2520" />

  <!-- Right ear -->
  <ellipse cx="93" cy="52" rx="12" ry="22" fill="#1a1714" />
  <ellipse cx="93" cy="54" rx="8" ry="16.5" fill="#2a2520" />

  <!-- Head -->
  <ellipse cx="64" cy="44" rx="24" ry="22" fill="#1a1714" />

  <!-- Muzzle -->
  <ellipse cx="64" cy="58" rx="14" ry="11" fill="#2a2520" />

  <!-- Nose -->
  <ellipse cx="64" cy="52" rx="6" ry="4.2" fill="#0f0d0b" />
  <ellipse cx="64" cy="51" rx="1.9" ry="1" fill="#4a4540" />

  <!-- Eyes -->
  <ellipse cx="53" cy="40" rx="5.2" ry="6.2" fill="#0f0d0b" />
  <ellipse cx="75" cy="40" rx="5.2" ry="6.2" fill="#0f0d0b" />
  <!-- Eye shine -->
  <circle cx="54.7" cy="38" r="1.8" fill="#fff" opacity="0.8" />
  <circle cx="76.7" cy="38" r="1.8" fill="#fff" opacity="0.8" />

  <!-- Scissors (carried in the mouth) -->
  <g transform="translate(64 84) rotate(-5)">
    <!-- Dark casing so the tool reads on both the cream frame and the black coat -->
    <g fill="none" stroke="#241f1b" stroke-linecap="round">
      <line x1="0" y1="0" x2="28" y2="-10" stroke-width="8" />
      <line x1="0" y1="0" x2="28" y2="10" stroke-width="8" />
      <line x1="0" y1="0" x2="-17" y2="-8.5" stroke-width="8" />
      <line x1="0" y1="0" x2="-17" y2="8.5" stroke-width="8" />
      <circle cx="-23" cy="-11" r="7" stroke-width="7" />
      <circle cx="-23" cy="11" r="7" stroke-width="7" />
    </g>
    <!-- Blades -->
    <g fill="none" stroke="#f5efe3" stroke-linecap="round" stroke-width="4.4">
      <line x1="0" y1="0" x2="27" y2="-9.6" />
      <line x1="0" y1="0" x2="27" y2="9.6" />
    </g>
    <!-- Handles -->
    <g fill="none" stroke="#d35f42" stroke-linecap="round">
      <line x1="0" y1="0" x2="-17" y2="-8.5" stroke-width="4.4" />
      <line x1="0" y1="0" x2="-17" y2="8.5" stroke-width="4.4" />
      <circle cx="-23" cy="-11" r="7" stroke-width="4" />
      <circle cx="-23" cy="11" r="7" stroke-width="4" />
    </g>
    <!-- Pivot -->
    <circle cx="0" cy="0" r="3.2" fill="#241f1b" />
    <circle cx="0" cy="0" r="1.4" fill="#f5efe3" />
  </g>

  <!-- Lower jaw, drawn over the pivot so the scissors read as gripped -->
  <ellipse cx="64" cy="74" rx="9.5" ry="11" fill="#1a1714" />
</svg>
